name: image
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pillow
  - pip
  - pip:
      - imagehash    # 可选: --phash 视觉去重时需要
# 外部依赖 (非 Python):
#   ExifTool: 从 https://exiftool.org/ 下载 Windows 版 (推荐 stay_open 持久进程提速 ~10x)
#   解压后任选其一：
#     ① ./exiftool.exe + ./exiftool_files/  (官方 zip 直接解压到项目根目录)
#     ② ./exiftool/exiftool.exe             (旧约定，自行放置)
#   detect_default_exiftool() 会自动按上述顺序探测
